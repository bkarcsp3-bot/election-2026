{% extends "base.html" %}
{% block title %}تسجيل الدخول - يوم الاقتراع 28 نوفمبر 2026{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center my-3">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-3">
                <img src="{{ url_for('static', filename='img/authority_logo.svg') }}" alt="شعار السلطة" width="88" height="88" class="mb-2">
                <h4 class="fw-bold mb-1" style="color:#0f2942;">بوابة المتابعة الانتخابية</h4>
                <div class="text-muted small fw-semibold">انتخاب أعضاء المجالس الشعبية البلدية والولائية</div>
                <span class="badge mt-2 px-3 py-2" style="background-color:#f5ebd4; color:#7c5612; border:1px solid #e3c88b; font-size:0.82rem;">
                    يوم الاقتراع: 28 نوفمبر 2026 — بلدية الخيثر
                </span>
            </div>

            <form method="POST" class="mt-3">
                <div class="mb-3">
                    <label class="form-label fw-bold">الصفة أو مركز التصويت:</label>
                    <select name="username" class="form-select form-select-lg" required>
                        <option value="" disabled selected>-- اختر المندوب البلدي أو المركز --</option>
                        {% for uname, info in users.items() %}
                        <option value="{{ uname }}">{{ info.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">كلمة المرور:</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn btn-gov-primary btn-lg w-100 py-2">تسجيل الدخول</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
